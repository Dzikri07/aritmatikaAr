<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barisan Aritmatika Interactive - Web AR</title>
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Control Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 100;
            max-width: 320px;
            color: #2c3e50;
        }

        #ui-panel h2 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 20px;
        }

        #ui-panel h3 {
            color: #2c3e50;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .input-group label {
            font-weight: bold;
            min-width: 60px;
            color: #34495e;
        }

        .input-group input {
            padding: 8px 12px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 14px;
            width: 70px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #add-term-btn {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
        }

        #add-term-btn:hover {
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4);
        }

        #add-term-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        #reset-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }

        #reset-btn:hover {
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }

        #start-btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* Formula Display */
        #formula {
            font-size: 18px;
            color: #1e3c72;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Progress Info */
        #progress-info {
            background: rgba(52, 152, 219, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(52, 152, 219, 0.3);
            margin-top: 15px;
            font-size: 13px;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            color: #34495e;
        }

        .progress-value {
            font-weight: bold;
            color: #2c3e50;
        }

        /* Status Panel */
        #status-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 100;
            min-width: 180px;
            color: #2c3e50;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            font-size: 13px;
        }

        .status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #95a5a6;
        }

        .status-icon.active {
            background: #27ae60;
            animation: pulse 2s infinite;
        }

        .status-icon.warning {
            background: #f39c12;
        }

        .status-icon.error {
            background: #e74c3c;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Marker Preview */
        #marker-preview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 100;
            text-align: center;
            max-width: 150px;
        }

        #marker-preview img {
            width: 100px;
            height: 100px;
            border: 2px solid #3498db;
            border-radius: 8px;
            margin-bottom: 10px;
            object-fit: cover;
        }

        #marker-preview p {
            color: #2c3e50;
            font-size: 12px;
            font-weight: bold;
        }

        /* Instructions */
        #instruction-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 100;
            max-width: 250px;
            color: #2c3e50;
        }

        #instruction-panel h4 {
            color: #1e3c72;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #instruction-panel ol {
            font-size: 12px;
            line-height: 1.6;
            padding-left: 20px;
            color: #34495e;
        }

        #instruction-panel li {
            margin: 6px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #ui-panel {
                max-width: 280px;
                padding: 15px;
                top: 10px;
                left: 10px;
            }

            #status-panel {
                top: 10px;
                right: 10px;
                min-width: 150px;
                padding: 10px 15px;
            }

            #instruction-panel,
            #marker-preview {
                display: none;
            }

            .btn {
                font-size: 12px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- UI Panel -->
    <div id="ui-panel">
        <button id="start-btn" class="btn">🚀 Mulai AR</button>
        
        <div id="formula">Un = a + (n - 1)b</div>
        
        <h3>Parameter</h3>
        <div class="input-group">
            <label>b (beda):</label>
            <input type="number" id="input-b" value="2" min="1" max="6">
        </div>

        <h3>Kontrol</h3>
        <div class="button-group">
            <button id="add-term-btn" class="btn">+ Tambah Suku</button>
            <button id="reset-btn" class="btn">Reset</button>
        </div>

        <div id="progress-info">
            <div class="progress-row">
                <span>Suku ke-n:</span>
                <span id="current-n" class="progress-value">1</span>
            </div>
            <div class="progress-row">
                <span>Un:</span>
                <span id="current-un" class="progress-value">2</span>
            </div>
        </div>
    </div>

    <!-- Status Panel -->
    <div id="status-panel">
        <div class="status-item">
            <div class="status-icon warning"></div>
            <span>Kamera: Standby</span>
        </div>
        <div class="status-item">
            <div class="status-icon warning"></div>
            <span>MindAR: Siap</span>
        </div>
        <div class="status-item">
            <div class="status-icon error"></div>
            <span>Marker: Tidak Terdeteksi</span>
        </div>
    </div>

    <!-- Marker Preview -->
    <div id="marker-preview">
        <img id="marker-img" src="./marker-qr.png" alt="Marker QR">
        <p>Arahkan ke marker ini</p>
    </div>

    <!-- Instructions -->
    <div id="instruction-panel">
        <h4>📖 Panduan:</h4>
        <ol>
            <li>Klik "Mulai AR"</li>
            <li>Izinkan akses kamera</li>
            <li>Arahkan ke marker</li>
            <li>Klik "Tambah Suku"</li>
        </ol>
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="near: 10; far: 10000; objects: .clickable"></a-camera>

        <!-- Marker Target -->
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            <!-- Cube besar akan di-generate oleh JavaScript -->
            <a-group id="cube-container"></a-group>
        </a-entity>
    </a-scene>

    <script>
        // ========== CONFIGURATION ==========
        const CONFIG = {
            a: 2,              // Nilai awal
            maxBigCubes: 6,     // Maksimal cube besar
            maxB: 6,            // Maksimal nilai b
            bigCubeSize: 0.5,   // Ukuran cube besar
            smallCubeSize: 0.15, // Ukuran cube kecil
            spacingX: 0.18,     // Jarak antar small cube
            spacingZ: 0.6,      // Jarak antar big cube (kedalaman)
            animationDuration: 800
        };

        // ========== STATE VARIABLES ==========
        let currentN = 1;
        let currentB = 2;
        let isARStarted = false;
        let isMarkerFound = false;
        let arSystem = null;
        let targetEntity = null;
        let cubeContainer = null;
        const cubes = { big: [], small: [] };

        // ========== HELPER FUNCTIONS ==========

        function calculateUn(a, b, n) {
            return a + (b * (n - 1));
        }

        function updateProgressInfo() {
            const un = calculateUn(CONFIG.a, currentB, currentN);
            document.getElementById('current-n').textContent = currentN;
            document.getElementById('current-un').textContent = un;
        }

        // ========== A-FRAME SCENE SETUP ==========

        document.addEventListener('DOMContentLoaded', function() {
            const sceneEl = document.querySelector('a-scene');
            targetEntity = document.querySelector('#ar-target');
            cubeContainer = document.querySelector('#cube-container');

            // Get AR System saat scene loaded
            sceneEl.addEventListener('loaded', function() {
                arSystem = sceneEl.systems['mindar-image-system'];
                console.log('✅ A-Frame scene loaded');
            });

            // AR Ready Event
            sceneEl.addEventListener('arReady', function() {
                console.log('🎉 MindAR ready!');
                isARStarted = true;
                updateStatus('mindar', 'active');
                updateStatus('camera', 'active');
            });

            // AR Error Event
            sceneEl.addEventListener('arError', function(event) {
                console.error('❌ MindAR error:', event);
                updateStatus('mindar', 'error');
                updateStatus('camera', 'error');
            });

            // Target Found Event
            targetEntity.addEventListener('targetFound', function() {
                console.log('📍 Marker found!');
                isMarkerFound = true;
                updateStatus('marker', 'active');
                document.getElementById('add-term-btn').disabled = false;
            });

            // Target Lost Event
            targetEntity.addEventListener('targetLost', function() {
                console.log('⚠️ Marker lost');
                isMarkerFound = false;
                updateStatus('marker', 'warning');
                document.getElementById('add-term-btn').style.opacity = '0.6';
            });

            // Start Button
            document.getElementById('start-btn').addEventListener('click', function() {
                console.log('🚀 Starting AR...');
                this.disabled = true;
                this.textContent = '⏳ Menginisialisasi...';
                arSystem.start();
            });

            // Add Term Button
            document.getElementById('add-term-btn').addEventListener('click', addTerm);

            // Reset Button
            document.getElementById('reset-btn').addEventListener('click', resetBarisan);

            // Input B Change
            document.getElementById('input-b').addEventListener('change', updateB);
            document.getElementById('input-b').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') updateB();
            });
        });

        // ========== CUBE CREATION ==========

        function createBigCube(number, position) {
            const entity = document.createElement('a-box');
            
            const hue = Math.random();
            const color = new THREE.Color().setHSL(hue, 0.7, 0.5);
            const hexColor = '#' + color.getHexString();
            
            entity.setAttribute('width', CONFIG.bigCubeSize);
            entity.setAttribute('height', CONFIG.bigCubeSize);
            entity.setAttribute('depth', CONFIG.bigCubeSize);
            entity.setAttribute('color', hexColor);
            entity.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
            entity.setAttribute('scale', '0.01 0.01 0.01'); // Start kecil untuk animasi
            entity.classList.add('big-cube');
            
            return entity;
        }

        function createSmallCube(position) {
            const entity = document.createElement('a-box');
            
            entity.setAttribute('width', CONFIG.smallCubeSize);
            entity.setAttribute('height', CONFIG.smallCubeSize);
            entity.setAttribute('depth', CONFIG.smallCubeSize);
            entity.setAttribute('color', '#ffa500');
            entity.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
            entity.setAttribute('scale', '0.01 0.01 0.01'); // Start kecil untuk animasi
            entity.classList.add('small-cube');
            
            return entity;
        }

        // ========== CUBE MANAGEMENT ==========

        function addTerm() {
            if (!isARStarted || !isMarkerFound) {
                alert('Arahkan kamera ke marker terlebih dahulu!');
                return;
            }

            if (currentN >= CONFIG.maxBigCubes) {
                alert(`Maksimal ${CONFIG.maxBigCubes} suku telah tercapai!`);
                return;
            }

            const un = calculateUn(CONFIG.a, currentB, currentN);

            // Create big cube
            const bigCubePos = new THREE.Vector3(0, 0.25, -(currentN - 1) * CONFIG.spacingZ);
            const bigCube = createBigCube(un, bigCubePos);
            cubeContainer.appendChild(bigCube);
            cubes.big.push(bigCube);

            // Animate in
            animateCube(bigCube, 0);

            // Create small cubes (difference representation)
            if (currentN > 1) {
                const smallCubesPos = new THREE.Vector3(
                    CONFIG.bigCubeSize / 2 + CONFIG.smallCubeSize * 0.5,
                    0.25,
                    -((currentN - 2) * CONFIG.spacingZ)
                );

                for (let i = 0; i < currentB; i++) {
                    const pos = new THREE.Vector3(
                        smallCubesPos.x + (i * CONFIG.spacingX),
                        smallCubesPos.y,
                        smallCubesPos.z
                    );
                    const smallCube = createSmallCube(pos);
                    cubeContainer.appendChild(smallCube);
                    cubes.small.push(smallCube);
                    animateCube(smallCube, 50 + (i * 50));
                }
            }

            currentN++;
            updateProgressInfo();

            if (currentN > CONFIG.maxBigCubes) {
                document.getElementById('add-term-btn').disabled = true;
            }
        }

        function resetBarisan() {
            // Remove all cubes
            cubes.big.forEach(cube => {
                if (cube.parentNode) cube.parentNode.removeChild(cube);
            });
            cubes.small.forEach(cube => {
                if (cube.parentNode) cube.parentNode.removeChild(cube);
            });
            
            cubes.big = [];
            cubes.small = [];
            currentN = 1;

            document.getElementById('add-term-btn').disabled = false;
            updateProgressInfo();
            console.log('🔄 Barisan reset');
        }

        function updateB() {
            const b = parseInt(document.getElementById('input-b').value);
            if (isNaN(b) || b < 1 || b > CONFIG.maxB) {
                alert(`Nilai b harus antara 1 dan ${CONFIG.maxB}!`);
                document.getElementById('input-b').value = currentB;
                return;
            }
            currentB = b;
            updateProgressInfo();
        }

        // ========== ANIMATION ==========

        function animateCube(entity, delay = 0) {
            setTimeout(() => {
                const startScale = 0.01;
                const endScale = 1;
                const startTime = Date.now();

                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / CONFIG.animationDuration, 1);
                    
                    const easeProgress = progress < 0.5 
                        ? 2 * progress * progress 
                        : -1 + (4 - 2 * progress) * progress;
                    
                    const scale = startScale + (endScale - startScale) * easeProgress;
                    entity.setAttribute('scale', `${scale} ${scale} ${scale}`);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };
                animate();
            }, delay);
        }

        // ========== STATUS MANAGEMENT ==========

        function updateStatus(type, status) {
            const statusIcon = document.querySelector(`.status-item:nth-child(${type === 'camera' ? 1 : type === 'mindar' ? 2 : 3}) .status-icon`);
            if (statusIcon) {
                statusIcon.className = 'status-icon';
                statusIcon.classList.add(status);
            }
        }

        // ========== INITIALIZATION ==========

        console.log('🌟 Barisan Aritmatika AR loaded');
        updateProgressInfo();
    </script>
</body>
</html>
